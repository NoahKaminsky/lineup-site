# Clears out open requests whose time has passed without an accepted offer.
# Runs hourly so a request for 2pm is gone soon after 2pm, not the next day.
# (Vercel's free plan only allows daily cron jobs; GitHub's scheduler is free.)
#
# Uses the same CRON_SECRET repository secret as completion-nudges.yml.
name: Expire requests

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired requests
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.lineup-aesthetics.ca/api/cron/expire-requests
